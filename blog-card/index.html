<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" href="img/favicon.ico" sizes="any" />
    <title>GreatFrontEnd Projects</title>
  </head>
  <body>
    <article
      class="article-card"
      aria-label="Article about top 5 living room inspirations"
    >
      <img
        class="article-card__img"
        src="./img/spacejoy-YqFz7UMm8qE-unsplash.jpg"
        alt="Living Room Image"
        width="340"
        height="288"
      />

      <div class="article-card__content">
        <ul class="article-card__tags">
          <li class="article-card__tag text-small">Interior</li>
        </ul>

        <h3 class="article-card__title">Top 5 Living Room Inspirations</h3>
        <p class="article-card__description">
          Curated vibrants colors for your living, make it pop & calm in the
          same time.
        </p>

        <button class="article-card__btn">
          Read more
          <!-- SVG: screenreaders won't read it -->
          <svg
            class="arrow"
            width="14"
            height="14"
            viewBox="0 0 14 14"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <path
              d="M10.4764 6.16658L6.00637 1.69657L7.18487 0.518066L13.6667 6.99992L7.18487 13.4817L6.00637 12.3032L10.4764 7.83325H0.333374V6.16658H10.4764Z"
              fill="#4338CA"
            />
          </svg>
        </button>
      </div>
    </article>
  </body>
</html>
